# DeepSeek-V4-Flash-0731 DSpark release profile.
#
# Default: TP2/DCP1, SparkInfer W4A8, fixed K5. K7 remains opt-in because
# long-context output-quality reports are still unresolved. Rare batch-wide
# BOS output has also been reported with K5 under deep, concurrent workloads;
# track https://github.com/local-inference-lab/rtx6kpro/issues/53.
#
# Native KV offload is opt-in with KV_OFFLOADING_SIZE=<total GiB>. For a
# tiered L1+L2 setup, pass the compact --kv-transfer-config JSON through
# EXTRA_VLLM_ARGS. Worker mappings and the delayed scheduler share one named
# backing until shutdown. SHM_SIZE must fit the L1 capacity plus runtime
# headroom; the default remains sufficient while offload is disabled.
#
# TP4 Lucifer CUTLASS example:
#   GPUS=0,1,2,3 TP_SIZE=4 BACKEND=lucifer-cutlass docker compose \
#     -f examples/docker-compose-ds4-v20-r27.yml up -d
services:
  ds4:
    image: ${IMAGE:-voipmonitor/vllm:gilded-gnosis-v20-vllm966d57c-sibbbdccc-fi801d57a-cu132-20260803-r27}
    container_name: ${NAME:-ds4-0731-r27}
    entrypoint: ["/usr/local/bin/serve-ds4-flash.sh"]
    network_mode: host
    ipc: host
    privileged: true
    init: true
    shm_size: ${SHM_SIZE:-32gb}
    gpus: all
    restart: unless-stopped
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 1048576
        hard: 1048576
      stack: 67108864
    environment:
      CUDA_VISIBLE_DEVICES: ${GPUS:-0,1}
      PORT: ${PORT:-8000}
      MODE: ${MODE:-dspark}
      BACKEND: ${BACKEND:-b12x-a8}
      TP_SIZE: ${TP_SIZE:-2}
      DCP_SIZE: ${DCP_SIZE:-1}
      DSPARK_DEPTH_MODE: ${DSPARK_DEPTH_MODE:-fixed}
      DSPARK_TOKENS: ${DSPARK_TOKENS:-5}
      MAX_NUM_SEQS: ${MAX_NUM_SEQS:-16}
      MAX_MODEL_LEN: ${MAX_MODEL_LEN:-131072}
      MAX_NUM_BATCHED_TOKENS: ${MAX_NUM_BATCHED_TOKENS:-8192}
      GPU_MEMORY_UTILIZATION: ${GPU_MEMORY_UTILIZATION:-0.975}
      LOAD_FORMAT: ${LOAD_FORMAT:-instanttensor}
      INSTANTTENSOR_BACKEND: ${INSTANTTENSOR_BACKEND:-BUFFERED}
      # Keep persistent native-L2 keys stable across complete process restarts.
      PYTHONHASHSEED: ${PYTHONHASHSEED:-0}
      # Total native host KV capacity across all TP ranks; 0 disables it.
      KV_OFFLOADING_SIZE: ${KV_OFFLOADING_SIZE:-0}
      # Existing helper escape hatch; use compact, whitespace-free JSON.
      EXTRA_VLLM_ARGS: ${EXTRA_VLLM_ARGS:-}
    volumes:
      - ${HF_CACHE:-/root/.cache/huggingface}:/root/.cache/huggingface
      - ${MODEL_ROOT:-/root/models}:/root/models:ro
      - ${JIT_CACHE:-./cache/ds4-v20-r27}:/cache
      - ${CONTAINER_TMP:-./cache/ds4-v20-r27/tmp}:/container-tmp

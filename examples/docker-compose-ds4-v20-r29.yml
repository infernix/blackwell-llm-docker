# DeepSeek-V4-Flash-0731 DSpark r29 release profile.
#
# Default: TP2/DCP1, B12X W4A8, fixed K5. r29 fixes the verifier row-capacity
# contract used by compressed MLA CUDA graphs. The release gate reproduced
# corrupted output on r28 at C64 (140/192 exact responses) and passed the
# identical r29 test (192/192).
#
# K7 is available with DSPARK_TOKENS=7. It improved C24-C32 throughput in the
# release sweep, but was slower at C1, coding, and C64, so K5 remains default.
# Dynamic depth is diagnostic-only for now; it was correct but slower here.
#
# Reproduce the C64 release gate with a short-context KV budget:
#   MAX_NUM_SEQS=64 MAX_MODEL_LEN=12288 docker compose \
#     -f examples/docker-compose-ds4-v20-r29.yml up -d
#
# Native KV offload is opt-in with KV_OFFLOADING_SIZE=<total GiB>. For a
# tiered L1+L2 setup, pass compact --kv-transfer-config JSON through
# EXTRA_VLLM_ARGS. SHM_SIZE must fit the L1 capacity plus runtime headroom.
services:
  ds4:
    image: ${IMAGE:-voipmonitor/vllm:gilded-gnosis-v20-vllm55db472-b12x6bc35fd-fi801d57a-cu132-20260807-r29}
    container_name: ${NAME:-ds4-0731-r29}
    entrypoint: ["/usr/local/bin/serve-ds4-flash.sh"]
    network_mode: host
    ipc: host
    privileged: true
    init: true
    shm_size: ${SHM_SIZE:-32gb}
    gpus: all
    restart: unless-stopped
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 1048576
        hard: 1048576
      stack: 67108864
    environment:
      CUDA_VISIBLE_DEVICES: ${GPUS:-0,1}
      PORT: ${PORT:-8000}
      MODE: ${MODE:-dspark}
      BACKEND: ${BACKEND:-b12x-a8}
      TP_SIZE: ${TP_SIZE:-2}
      DCP_SIZE: ${DCP_SIZE:-1}
      DSPARK_DEPTH_MODE: ${DSPARK_DEPTH_MODE:-fixed}
      DSPARK_TOKENS: ${DSPARK_TOKENS:-5}
      MAX_NUM_SEQS: ${MAX_NUM_SEQS:-16}
      GRAPH: ${GRAPH:-auto}
      MAX_MODEL_LEN: ${MAX_MODEL_LEN:-131072}
      MAX_NUM_BATCHED_TOKENS: ${MAX_NUM_BATCHED_TOKENS:-8192}
      GPU_MEMORY_UTILIZATION: ${GPU_MEMORY_UTILIZATION:-0.975}
      LOAD_FORMAT: ${LOAD_FORMAT:-instanttensor}
      INSTANTTENSOR_BACKEND: ${INSTANTTENSOR_BACKEND:-BUFFERED}
      PYTHONHASHSEED: ${PYTHONHASHSEED:-0}
      KV_OFFLOADING_SIZE: ${KV_OFFLOADING_SIZE:-0}
      EXTRA_VLLM_ARGS: ${EXTRA_VLLM_ARGS:-}
    volumes:
      - ${HF_CACHE:-/root/.cache/huggingface}:/root/.cache/huggingface
      - ${MODEL_ROOT:-/root/models}:/root/models:ro
      - ${JIT_CACHE:-./cache/ds4-v20-r29}:/cache
      - ${CONTAINER_TMP:-./cache/ds4-v20-r29/tmp}:/container-tmp

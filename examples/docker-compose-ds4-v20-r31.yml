# DeepSeek-V4-Flash-0731 DSpark r31 release profile.
#
# Default: TP2/DCP1, B12X W4A8, fixed K5. r31 retains all qualified r30 paths,
# updates FlashInfer to the qualified main + PR #4393 source tree, and selects
# its PCIe IPC all-reduce automatically at TP2. TP4 and larger retain B12X,
# which remains faster for those topologies. Override the policy explicitly
# with ALLREDUCE_MODE=b12x or ALLREDUCE_MODE=flashinfer-ipc.
#
# Mixed-Trellis target and native-MTP route packing are prewarmed before KV
# sizing, avoiding first-request scratch allocations without reserving extra
# runtime KV capacity.
#
# Target, DSpark proposal, and DFlash context-KV execution use their own FULL
# CUDA graph families. Prefill remains PIECEWISE, and unsupported shapes keep
# the existing eager fallback.
#
# K7 is available with DSPARK_TOKENS=7. It can win on predictable code, but
# K5 remains the qualified mixed-workload default.
#
# Native L1 KV offload is opt-in with KV_OFFLOADING_SIZE=<total GiB>. Add a
# bounded filesystem L2 with NATIVE_L2_PATH=/native-l2 and NATIVE_L2_GB=<GiB>;
# the helper builds the connector config. SHM_SIZE must fit L1 plus headroom.
# The helper automatically disables expandable CUDA allocator segments while
# native offload is enabled because its shared host region requires stable
# registrations.
services:
  ds4:
    image: ${IMAGE:-voipmonitor/vllm:gilded-gnosis-v20-vllmfa13d33-b12xacee6e5-fi1ac6942-cu132-20260807-r31}
    container_name: ${NAME:-ds4-0731-r31}
    entrypoint: ["/usr/local/bin/serve-ds4-flash.sh"]
    network_mode: host
    ipc: host
    init: true
    shm_size: ${SHM_SIZE:-32gb}
    gpus: all
    restart: unless-stopped
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 1048576
        hard: 1048576
      stack: 67108864
    environment:
      CUDA_VISIBLE_DEVICES: ${GPUS:-0,1}
      PORT: ${PORT:-8000}
      MODE: ${MODE:-dspark}
      BACKEND: ${BACKEND:-b12x-a8}
      TP_SIZE: ${TP_SIZE:-2}
      DCP_SIZE: ${DCP_SIZE:-1}
      ALLREDUCE_MODE: ${ALLREDUCE_MODE:-auto}
      DSPARK_DEPTH_MODE: ${DSPARK_DEPTH_MODE:-fixed}
      DSPARK_TOKENS: ${DSPARK_TOKENS:-5}
      MAX_NUM_SEQS: ${MAX_NUM_SEQS:-16}
      GRAPH: ${GRAPH:-auto}
      MAX_MODEL_LEN: ${MAX_MODEL_LEN:-131072}
      MAX_NUM_BATCHED_TOKENS: ${MAX_NUM_BATCHED_TOKENS:-8192}
      GPU_MEMORY_UTILIZATION: ${GPU_MEMORY_UTILIZATION:-0.975}
      LOAD_FORMAT: ${LOAD_FORMAT:-instanttensor}
      INSTANTTENSOR_BACKEND: ${INSTANTTENSOR_BACKEND:-BUFFERED}
      PYTHONHASHSEED: ${PYTHONHASHSEED:-0}
      KV_OFFLOADING_SIZE: ${KV_OFFLOADING_SIZE:-0}
      NATIVE_L2_PATH: ${NATIVE_L2_PATH:-}
      NATIVE_L2_GB: ${NATIVE_L2_GB:-}
      EXTRA_VLLM_ARGS: ${EXTRA_VLLM_ARGS:-}
    volumes:
      - ${HF_CACHE:-/root/.cache/huggingface}:/root/.cache/huggingface
      - ${MODEL_ROOT:-/root/models}:/root/models:ro
      - ${JIT_CACHE:-./cache/ds4-v20-r31}:/cache
      - ${CONTAINER_TMP:-./cache/ds4-v20-r31/tmp}:/container-tmp
      - ${NATIVE_L2_HOST_PATH:-./cache/ds4-v20-r31/native-l2}:/native-l2
